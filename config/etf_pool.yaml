# A-share sector ETF rotation pool (Q9). One representative ETF per distinct sector.
# All codes below verified against live AkShare (see scripts/verify_pool.py).
# Names are human labels (may differ slightly from market name). Edit freely; log changes.
#
# style / style_alt (Phase 1-A 三类分类): value=价值 / growth=成长 / cyclic=周期。
# 主类型 style 驱动主指标路径;次类型 style_alt 仅附加展示(软分类)。
# 依据 PRD §4.3 草案 + 课程 S09-11。模糊标的(食品饮料/医药/家电)走主+次。
#
# group (板块资金流向聚合, 2026-08): 行业级分组 26 组——每个行业独立、只合并真正相近的
# 行业（跨境与大A分开：恒生医疗/纳指各自独立、港股科技=恒科+中概；通信与传媒分开；
# 有色与煤炭分开（商品周期不同源）；新能源=电力设备同族；中游材料=钢铁+建材+化工；
# 黄金=单成员组·research_only·2026-09 加入）。
# 仅驱动 research 看板「板块资金流向」section 的份额净申赎聚合(research/flow.py)，
# 不参与交易引擎。
#
# research_only (2026-09): 该 ETF 只上研究看板、不进交易引擎——rotation_symbols() 会
# 过滤掉这类行（引擎/回测/晨报宇宙不含它），tracked_symbols()/all_symbols() 包含
# （研究看板标的清单 + 价格/份额/净值数据腿覆盖它）。用途：纯跟踪观察标的（如黄金
# T+0 品种，与引擎 T+1 假设不合）。缺省（不写）= 可交易，行为不变。
#
# index_code / index_expect (E1 成分股底座, 2026-08): 跟踪指数代码(中证体系) + 名称哨兵关键词。
# 用途: index_stock_cons_weight_csindex 拉官方全成分+权重(月度快照) → index_constituents 表 →
# etf_earnings 聚合的持仓底座(B 路线, 替代已死的 top-10 重仓端点 fund_portfolio_hold_em)。
# 拉取时校验返回的指数名称含 index_expect, 不符即拒——防猜错代码/端点串台(调研期靠它抓到
# 930999=SHS大湾区 的错配)。码表来源: docs/RESEARCH-ETF行业业绩预期.md §5(2026-08-16 实测)。
# 缺 index_code = 无免费成分源(QDII 跨境 4 只 / 512480 CES半导体·中华交易服务体系 /
# 159915 创业板指·国证系) → 该 ETF 走降级(不参与成分聚合, 看板显示数据不足)。

# Functional roles (not part of rotation ranking):
benchmark:
  symbol: "510300"
  name: "沪深300ETF"
  role: regime_benchmark   # used by regime layer + backtest benchmark

risk_off:
  symbol: "511990"
  name: "华宝添益货币ETF"
  role: risk_off_parking

