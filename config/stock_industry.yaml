# 候选个股池 (V7 pool · 第六看板): 行业板块 → 三类粗分 + 周期上游商品映射
#
# 维护规则:
#   · 板块名以 industry_member 快照为准。2026-08-17 起东财端点切申万三级口径(457 板块,
#     一股挂多层级); store.industry_map() 取成分数最小的最深层级,本表按叶子名映射(旧 86 板块
#     名已全对不上→0% 覆盖,2026-08-19 按新名单重写)。
#     `python scripts/backfill_stock_pool.py --industry` 跑完打印「未映射板块」清单(带成分数),
#     新板块名补进来即可——未映射 = 该板块股票 type=None,不入策略2(策略1/PEAD/变脸不受影响)。
#   · type: cyclic(周期) / growth(成长) / value(价值)。粗分定位:策略2 的周期腿需要 commodity,
#     无商品映射的周期板块(中游制造/航运/券商等)诚实不入策略2。
#   · commodity: 仅 cyclic 上游适用,取 commodity_price 表 13 品种之一
#     (碳酸锂/铜/铝/锌/螺纹钢/铁矿石/焦煤/黄金/白银/原油/玻璃/纯碱/生猪);
#     板块级粗映射(如 工业金属→铜,铜/铝/锌混板接受);中游(电池/光伏)价格信号方向不纯,不映射。
#   · 综合类(综合/综合Ⅱ/综合Ⅲ)故意不映射:无法粗分,诚实 type=None。
